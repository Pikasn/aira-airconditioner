<div class="tint cool" aria-hidden="true"></div><div class="tint heat" aria-hidden="true"></div><div class="tint dry" aria-hidden="true"></div><div class="tint fan" aria-hidden="true"></div><div class="tint auto" aria-hidden="true"></div>
<div class="room-atmosphere" aria-hidden="true"><i class="edge-motif"><svg viewBox="0 0 100 100"><use class="edge-cool" href="#edge-frost"/><use class="edge-heat" href="#edge-warm"/><use class="edge-dry" href="#edge-dry"/><use class="edge-fan" href="#edge-breeze"/><use class="edge-auto" href="#edge-breeze"/></svg></i><i class="edge-motif"><svg viewBox="0 0 100 100"><use class="edge-cool" href="#edge-frost"/><use class="edge-heat" href="#edge-warm"/><use class="edge-dry" href="#edge-dry"/><use class="edge-fan" href="#edge-breeze"/><use class="edge-auto" href="#edge-breeze"/></svg></i><i class="edge-motif"><svg viewBox="0 0 100 100"><use class="edge-cool" href="#edge-frost"/><use class="edge-heat" href="#edge-warm"/><use class="edge-dry" href="#edge-dry"/><use class="edge-fan" href="#edge-breeze"/><use class="edge-auto" href="#edge-breeze"/></svg></i><i class="edge-motif"><svg viewBox="0 0 100 100"><use class="edge-cool" href="#edge-frost"/><use class="edge-heat" href="#edge-warm"/><use class="edge-dry" href="#edge-dry"/><use class="edge-fan" href="#edge-breeze"/><use class="edge-auto" href="#edge-breeze"/></svg></i><i class="edge-motif"><svg viewBox="0 0 100 100"><use class="edge-cool" href="#edge-frost"/><use class="edge-heat" href="#edge-warm"/><use class="edge-dry" href="#edge-dry"/><use class="edge-fan" href="#edge-breeze"/><use class="edge-auto" href="#edge-breeze"/></svg></i><i class="edge-motif"><svg viewBox="0 0 100 100"><use class="edge-cool" href="#edge-frost"/><use class="edge-heat" href="#edge-warm"/><use class="edge-dry" href="#edge-dry"/><use class="edge-fan" href="#edge-breeze"/><use class="edge-auto" href="#edge-breeze"/></svg></i></div>
<div class="shell">
  <main class="hero" aria-label="客厅空调">
    <section class="scene" id="scene">
      <div class="machine-stage">
        <div class="machine">
          <div class="face">
            <button id="power" class="power" type="button" aria-label="关机" title="关机"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 2.5v9.5"/><path d="M6.4 6.2a8 8 0 1 0 11.2 0"/></svg></button>
            <div class="model-controls">
              <button id="modeControl" class="control-button active" type="button" aria-label="制冷，点击切换" title="制冷" data-mode="cool"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-mode-cool"></use></svg></button>
              <button id="speedControl" class="control-button" type="button" aria-label="自动风速，点击切换" title="自动风速" data-speed="auto"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-speed-auto"></use></svg></button>
              <button id="directionControl" class="control-button" type="button" aria-label="下吹，点击切换" title="下吹" data-direction="down" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-direction-down"></use></svg></button>
            </div>
            <div class="dial-box">
              <svg class="dial" id="dial" viewBox="0 0 360 360" role="slider" tabindex="0" aria-label="设定温度" aria-valuemin="16" aria-valuemax="32" aria-valuenow="26" aria-describedby="climateReading">
                <rect id="dialHit" width="360" height="360" fill="none" pointer-events="all"></rect>
                <path id="track" class="track"></path><path id="prog" class="prog"></path>
                <g id="knob" class="knob"><circle r="15" fill="transparent"></circle><circle r="9" fill="#fff" stroke="var(--accent)" stroke-width="2.8"></circle></g>
              </svg>
              <div class="dial-core">
                <div class="core-temp"><span id="bigTemp">26</span><i>°C</i></div>
                <div class="climate-reading" id="climateReading" aria-label="室温 27 摄氏度，湿度 58%">
                  <span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 9.2V3a2 2 0 0 1 4 0v6.2a3.5 3.5 0 1 1-4 0Z"/><path d="M8 4v7"/></svg>27°</span>
                  <span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5C6 4.2 3.8 6.7 3.8 9.5a4.2 4.2 0 1 0 8.4 0C12.2 6.7 10 4.2 8 1.5Z"/></svg>58%</span>
                </div>
              </div>
            </div>
          </div>
          <div class="machine-bottom"><div class="dark-slat"></div><div class="louver" id="louver"></div></div>
        </div>
      </div>
      <canvas class="airflow-canvas" id="airCanvas" aria-hidden="true"></canvas>
      <section class="timer-drawer" id="timerDrawer" aria-label="定时">
        <div class="timer-panel" id="timerPanel" hidden>
          <div class="timer-head">
            <span class="timer-caption">定时</span>
            <span class="timer-state" id="timerState">未设置</span>
          </div>
          <div class="timer-row">
            <div class="timer-seg" role="group" aria-label="到点动作">
              <button class="timer-seg-btn is-active" type="button" data-action="off" aria-pressed="true">关机</button>
              <button class="timer-seg-btn" type="button" data-action="on" aria-pressed="false">开机</button>
            </div>
            <div class="timer-seg" role="group" aria-label="定时方式">
              <button class="timer-seg-btn is-active" type="button" data-mode="after" aria-pressed="true">倒计时</button>
              <button class="timer-seg-btn" type="button" data-mode="at" aria-pressed="false">指定时刻</button>
            </div>
          </div>
          <div class="timer-row timer-durations" id="timerDurations" role="group" aria-label="倒计时时长">
            <button class="timer-chip" type="button" data-minutes="30">30 分钟</button>
            <button class="timer-chip is-active" type="button" data-minutes="60">1 小时</button>
            <button class="timer-chip" type="button" data-minutes="120">2 小时</button>
            <button class="timer-chip" type="button" data-minutes="240">4 小时</button>
            <button class="timer-chip" type="button" data-minutes="480">8 小时</button>
          </div>
          <div class="timer-row timer-clock" id="timerClock" hidden>
            <label for="timerTime">到点时刻</label>
            <input type="time" id="timerTime" step="60">
          </div>
          <div class="timer-row timer-actions">
            <button class="timer-start" id="timerStart" type="button">开始定时</button>
            <button class="timer-cancel" id="timerCancel" type="button" hidden>取消定时</button>
          </div>
          <p class="timer-hint" id="timerHint">到点由本机服务执行，程序保持运行即可（可最小化或悬浮）。</p>
        </div>
        <span class="sr-only" id="timerAnnounce" role="status" aria-live="polite"></span>
        <button class="timer-handle" id="timerHandle" type="button" aria-expanded="false" aria-controls="timerPanel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.4"/><path d="M12 7.6v4.9l3.1 1.9"/></svg>
          <span class="timer-label">定时</span>
          <span class="timer-summary" id="timerSummary">未设置</span>
          <svg class="timer-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
        </button>
      </section>
    </section>
  </main>
</div>
