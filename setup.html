<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <script>if(window.chrome?.webview)document.documentElement.classList.add('desktop');</script>
  <title>空调设置</title>
  <link rel="stylesheet" href="/setup.css">
  <link rel="stylesheet" href="/desktop.css">
  <link rel="stylesheet" href="/floating.css">
  <script src="/desktop.js" defer></script>
  <script src="/setup.js" defer></script>
</head>
<body>
  <main class="connect-card">
    <a class="back" href="/" aria-label="返回空调"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></a>
    <h1>设置</h1>
    <p class="subtitle">米家空调伴侣 2</p>
    <form id="connectionForm" autocomplete="off">
      <label for="deviceIp">设备 IP</label>
      <div class="ip-field">
        <input id="deviceIp" name="ip" placeholder="局域网 IP 地址" inputmode="decimal" maxlength="15" spellcheck="false" required>
        <button id="discover" class="find" type="button">查找</button>
      </div>
      <div id="deviceList" class="device-list" hidden></div>
      <p id="discoveryMessage" class="helper" role="status" hidden></p>
      <div class="token-label"><label for="deviceToken">Token</label><a id="tokenTool" href="https://github.com/PiotrMachowski/Xiaomi-cloud-tokens-extractor/releases/latest" target="_blank" rel="noopener noreferrer" title="打开获取工具的下载页">获取 IP / Token ↗</a></div>
      <input id="deviceToken" name="token" type="password" autocomplete="off" placeholder="32 位设备 Token" maxlength="32" pattern="[a-fA-F0-9]{32}" spellcheck="false" required>
      <p class="helper">只在本机加密保存。</p>
      <button class="connect" id="connect" type="submit">测试并连接</button>
      <p id="setupMessage" class="result" role="status" aria-live="polite"></p>
      <a class="open-control" id="openControl" href="/" hidden>打开空调 <span aria-hidden="true">→</span></a>
    </form>
    <section id="windowSettings" class="window-settings" hidden>
      <h2>窗口模式</h2>
      <div class="presentation-options" role="group" aria-label="窗口模式">
        <button type="button" data-presentation="standard" aria-pressed="false" title="空调主界面"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18m-4-2h1"/></svg>空调主界面</button>
        <button type="button" data-presentation="compact" aria-pressed="false" title="拖动横条，靠边自动隐藏"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="8" width="20" height="8" rx="4"/><path d="M7 12h3m5 0h.01m3 0h.01"/></svg>温控悬浮条</button>
        <button type="button" data-presentation="bubble" aria-pressed="false" title="滚轮调温，点击回到空调"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 5a7 7 0 0 1 6 3.5M9 11v5m0-7h.01m4 2h2v5h-2z"/></svg>温控悬浮球</button>
      </div>
      <label class="topmost-option" for="floatingTopmost"><span>悬浮时置顶</span><input id="floatingTopmost" type="checkbox" role="switch" title="只影响悬浮条和悬浮球"></label>
    </section>
    <details>
      <summary>如何获取 IP / Token</summary>
      <ol>
        <li><a href="https://github.com/PiotrMachowski/Xiaomi-cloud-tokens-extractor/releases/latest" target="_blank" rel="noopener noreferrer">下载 Windows 获取工具 ↗</a>，运行后选择扫码登录。</li>
        <li>地区与米家保持一致，找到“米家空调伴侣 2”。</li>
        <li>把设备 IP 和 Token 填在这里，再连接。</li>
      </ol>
      <p>电脑与伴侣需在同一局域网，空调遥控先在米家中匹配完成。查找不到 IP 时，也可查看路由器的设备列表。</p>
    </details>
  </main>
</body>
</html>
